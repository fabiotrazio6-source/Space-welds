<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Space welds</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#060912;--ink:#eaf0ff;--blue:#2f7bff;--blue2:#5a98ff;--spark:#ffb347;--panel:#0d1424;--line:#243252;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Chakra Petch',system-ui,sans-serif;overflow:hidden}
canvas{touch-action:none;position:fixed;inset:0;width:100%;height:100%;display:block}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px;text-align:center;transition:opacity .5s,transform .5s}
.screen.off{opacity:0;pointer-events:none;transform:scale(1.06)}
#s2.off{transform:scale(.94)}
h1{margin:0;font-size:clamp(44px,13vw,110px);font-weight:700;letter-spacing:.02em;line-height:1;text-shadow:0 0 40px rgba(47,123,255,.45)}
button{font:inherit;font-weight:700;font-size:20px;border:0;border-radius:6px;padding:14px 44px;cursor:pointer;color:#fff;transition:transform .15s,box-shadow .15s}
button:focus-visible,input:focus-visible{outline:3px solid var(--spark);outline-offset:3px}
#play{background:var(--blue);box-shadow:0 0 0 1px var(--blue2) inset,0 8px 30px rgba(47,123,255,.45)}
#play:hover{transform:translateY(-2px);background:var(--blue2)}
#mk,#cont,#cfgbtn{background:var(--panel);box-shadow:0 0 0 1px var(--line) inset}
#mk:hover,#cont:hover,#cfgbtn:hover{transform:translateY(-2px);box-shadow:0 0 0 1px var(--blue2) inset}
#modal,#fl,#wl,#gs{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(3,5,12,.7);transition:opacity .25s}
#modal.off,#fl.off,#wl.off,#gs.off{opacity:0;pointer-events:none}
.card{width:min(380px,100%);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:26px;text-align:left;display:flex;flex-direction:column;gap:12px;transition:transform .25s}
#modal.off .card,#fl.off .card,#wl.off .card,#gs.off .card{transform:translateY(14px)}
label,.lbl{font-size:15px;color:#9fb0d6}
input{font:inherit;font-size:18px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px;width:100%;box-sizing:border-box}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:12px 0;font-size:17px;background:var(--bg);color:#9fb0d6;box-shadow:0 0 0 1px var(--line) inset}
.seg button[aria-pressed=true]{background:var(--blue);color:#fff;box-shadow:none}
#ok,#saveCfg{background:var(--blue);margin-top:6px;box-shadow:0 0 0 1px var(--blue2) inset}
#ok:hover,#saveCfg:hover{background:var(--blue2)}
#s3{background:var(--bg);z-index:5;gap:18px}
#s3.off{transform:none}
.bar{width:min(260px,70vw);height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--blue2)}
#s3:not(.off) .bar i{animation:fill var(--dur,4s) linear forwards}
@keyframes fill{to{width:100%}}
#menu{position:fixed;right:max(8px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);z-index:4;display:flex;flex-direction:column;gap:6px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;user-select:none;-webkit-user-select:none}
#menu.off{display:none}
#menu button{width:38px;height:38px;padding:0;display:grid;place-items:center;background:var(--bg);color:var(--ink);box-shadow:0 0 0 1px var(--line) inset;touch-action:none;cursor:grab}
#menu button:hover{box-shadow:0 0 0 1px var(--blue2) inset}
#menu svg{width:22px;height:22px;fill:currentColor;pointer-events:none}
#launch{position:fixed;right:max(8px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));z-index:4;width:44px;height:44px;padding:0;display:grid;place-items:center;background:var(--blue);box-shadow:0 0 0 1px var(--blue2) inset,0 6px 20px rgba(47,123,255,.4)}
#launch:hover{background:var(--blue2)}
#launch.off{display:none}
#launch svg{width:24px;height:24px;fill:#fff;pointer-events:none}
#joy{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:max(22px,env(safe-area-inset-bottom,0px));z-index:4;width:120px;height:120px;border-radius:50%;background:rgba(13,20,36,.65);border:1px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none}
#joy.off{display:none}
#knob{position:absolute;left:36px;top:36px;width:48px;height:48px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 1px var(--blue2) inset,0 4px 14px rgba(47,123,255,.5);pointer-events:none}
#thr{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:max(22px,env(safe-area-inset-bottom,0px));z-index:4;width:44px;height:150px;border-radius:22px;background:rgba(13,20,36,.65);border:1px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none}
#thr.off{display:none}
#thrFill{position:absolute;left:4px;right:4px;bottom:4px;height:0;border-radius:18px;background:var(--blue);border-top:3px solid var(--blue2);box-sizing:border-box;pointer-events:none}
#mapbtn{position:fixed;left:max(12px,env(safe-area-inset-left,0px));top:max(12px,env(safe-area-inset-top,0px));z-index:4;width:44px;height:44px;padding:0;display:grid;place-items:center;background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line) inset}
#mapbtn.off,#mhud.off{display:none}
#mapbtn svg{width:24px;height:24px;pointer-events:none}
#mhud{position:fixed;right:max(12px,env(safe-area-inset-right,0px));top:max(12px,env(safe-area-inset-top,0px));z-index:4;font-size:14px;line-height:1.4;text-align:right;white-space:pre;pointer-events:none;text-shadow:0 0 6px #000}
#twbtn{position:fixed;left:max(12px,env(safe-area-inset-left,0px));top:calc(max(12px,env(safe-area-inset-top,0px)) + 52px);z-index:4;width:44px;height:44px;padding:0;display:grid;place-items:center;background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line) inset}
#twbtn.on{background:var(--blue)}
#twbtn svg{width:24px;height:24px;fill:currentColor;pointer-events:none}
#twsel{position:fixed;left:calc(max(12px,env(safe-area-inset-left,0px)) + 52px);top:calc(max(12px,env(safe-area-inset-top,0px)) + 52px);z-index:4;display:flex;align-items:center;gap:6px;height:44px;padding:0 6px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
#twsel button{width:40px;height:32px;padding:0;font-size:20px;background:var(--bg);color:var(--ink);box-shadow:0 0 0 1px var(--line) inset}
#twsel span{min-width:38px;text-align:center;font-weight:700}
#twbtn.off,#twsel.off{display:none}
#flcard button,#wlcard .wmain{width:100%;text-align:left;padding:12px 14px;font-size:17px;background:var(--bg);color:var(--ink);box-shadow:0 0 0 1px var(--line) inset;display:flex;flex-direction:column;gap:3px}
#flcard button:hover,#wlcard .wmain:hover{box-shadow:0 0 0 1px var(--blue2) inset}
#flcard .sub,#wlcard .sub{font-size:13px;font-weight:500;color:#9fb0d6}
#sepbtn{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(max(22px,env(safe-area-inset-bottom,0px)) + 164px);z-index:4;width:44px;height:44px;padding:0;display:grid;place-items:center;background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line) inset}
#sepbtn.off{display:none}
#sepbtn svg{width:24px;height:24px;fill:currentColor;pointer-events:none}
h2{margin:0;font-size:clamp(28px,8vw,40px);font-weight:700}
.opts{display:flex;flex-direction:column;gap:12px;width:min(280px,80vw)}
.opts button{width:100%;padding:14px 0;background:var(--panel);box-shadow:0 0 0 1px var(--line) inset}
.opts button:hover{box-shadow:0 0 0 1px var(--blue2) inset}
.opts button[aria-pressed=true]{background:var(--blue);box-shadow:none}
#wlcard{max-height:80vh;overflow:auto}
.wrow{display:flex;gap:8px}
#wlcard .wmain{flex:1;min-width:0}
#wlcard .wdel{flex:none;min-width:48px;width:auto;padding:0 10px;font-size:14px;background:var(--bg);color:#9fb0d6;box-shadow:0 0 0 1px var(--line) inset;display:grid;place-items:center}
#wlcard .wdel.armed{background:#b3362b;color:#fff;box-shadow:none}
#wlcard .wnew{width:100%;padding:14px 0;background:var(--blue);box-shadow:0 0 0 1px var(--blue2) inset;margin-top:4px}
#hstats{position:fixed;left:max(14px,env(safe-area-inset-left,0px));top:max(14px,env(safe-area-inset-top,0px));z-index:4;font-size:18px;font-weight:700;line-height:1.5;white-space:pre;pointer-events:none;text-shadow:0 1px 6px #000}
#hstats.off{display:none}
#gbtn{position:fixed;left:max(12px,env(safe-area-inset-left,0px));top:calc(max(12px,env(safe-area-inset-top,0px)) + 104px);z-index:4;width:44px;height:44px;padding:0;display:grid;place-items:center;background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line) inset}
#gbtn.off,#backbtn.off{display:none}
#backbtn{position:fixed;left:max(12px,env(safe-area-inset-left,0px));top:calc(max(12px,env(safe-area-inset-top,0px)) + 156px);z-index:4;width:44px;height:44px;padding:0;display:grid;place-items:center;background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line) inset}
#backbtn svg{width:24px;height:24px;pointer-events:none}
#gbtn svg{width:24px;height:24px;fill:currentColor;pointer-events:none}
#backbtn{position:fixed;left:max(12px,env(safe-area-inset-left,0px));top:calc(max(12px,env(safe-area-inset-top,0px)) + 156px);z-index:4;width:44px;height:44px;padding:0;display:grid;place-items:center;background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line) inset}
#backbtn.off{display:none}
#backbtn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="screen" id="s1">
  <h1>Space welds</h1>
  <button id="play" data-i18n="play">Play</button>
  <button id="cont" data-i18n="cont">Continuar progresso</button>
  <button id="cfgbtn" data-i18n="cfg">Configurações</button>
</div>

<div class="screen off" id="s4">
  <h2 data-i18n="gfx">Gráficos</h2>
  <div class="opts" id="gfxOpts">
    <button data-g="baixo" data-i18n="low">Baixo</button>
    <button data-g="medio" data-i18n="mid">Médio</button>
    <button data-g="alto" data-i18n="high">Alto</button>
  </div>
</div>

<div class="screen off" id="s5">
  <h2 data-i18n="lang">Linguagem</h2>
  <div class="opts" id="langOpts">
    <button data-l="pt" data-i18n="br">Brasil</button>
    <button data-l="es" data-i18n="es">Espanha</button>
    <button data-l="en" data-i18n="us">EUA</button>
  </div>
  <button id="saveCfg" data-i18n="save">Salvar</button>
</div>

<div id="wl" class="off" role="dialog" aria-label="Mundos"><div class="card" id="wlcard"></div></div>

<div id="fl" class="off" role="dialog" aria-label="Voos pausados"><div class="card" id="flcard"></div></div>

<div class="screen off" id="s2">
  <button id="mk" data-i18n="mk">Criar mundo</button>
</div>

<div id="modal" class="off" role="dialog" aria-label="Criar mundo">
  <div class="card">
    <label for="nome" data-i18n="name">Nome</label>
    <input id="nome" type="text" maxlength="30" autocomplete="off">
    <span class="lbl" data-i18n="diff">Dificuldade</span>
    <div class="seg" id="dif">
      <button aria-pressed="true" data-v="normal" data-i18n="normal">Normal</button>
      <button aria-pressed="false" data-v="dificil" data-i18n="hard">Difícil</button>
    </div>
    <button id="ok" data-i18n="ok">Confirmar</button>
  </div>
</div>

<div class="screen off" id="s3">
  <span style="font-size:24px;font-weight:700" data-i18n="loading">Carregando...</span>
  <div class="bar"><i></i></div>
</div>

<div id="menu" class="off">
  <button data-p="capsula" aria-label="Cápsula" title="Cápsula"><svg viewBox="0 0 24 24"><path d="M9 3h6l4 18H5z"/></svg></button>
  <button data-p="cone" aria-label="Cone aerodinâmico" title="Cone aerodinâmico"><svg viewBox="0 0 24 24"><path d="M12 2c4 4 6.500 9 6.500 15h-13C5.500 11 8 6 12 2z"/></svg></button>
  <button data-p="tanquemedio" aria-label="Tanque médio" title="Tanque médio"><svg viewBox="0 0 24 24"><rect x="7" y="6" width="10" height="12"/></svg></button>
  <button data-p="tanque" aria-label="Tanque" title="Tanque"><svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20"/></svg></button>
  <button data-p="motor" aria-label="Motor" title="Motor"><svg viewBox="0 0 24 24"><path d="M10 2h4v4h-4zM9 7h6l4 15H5z"/></svg></button>
  <button data-p="motoraviao" aria-label="Motor de avião" title="Motor de avião"><svg viewBox="0 0 24 24"><path d="M3 3h18v2H3zM9 6h6v16H9z"/></svg></button>
  <button data-p="separador" aria-label="Separador" title="Separador"><svg viewBox="0 0 24 24"><path d="M4 8h16v3H4zM4 13h16v3H4z"/></svg></button>
  <button data-p="asa" aria-label="Asa" title="Asa"><svg viewBox="0 0 24 24"><path d="M4 4l16 6v6L4 20z"/></svg></button>
</div>

<button id="launch" class="off" aria-label="Lançar" title="Lançar"><svg viewBox="0 0 24 24"><path d="M12 1c3 2.5 4.5 6 4.5 10 0 1.6-.2 3-.5 4.2l2.5 2.3V21l-3.7-1.6H9.2L5.5 21v-3.5L8 15.2C7.700 14 7.500 12.600 7.500 11 7.500 7 9 3.500 12 1zm0 6a2 2 0 100 4 2 2 0 000-4zM10 20.500h4L12 24z"/></svg></button>

<div id="joy" class="off" aria-label="Joystick"><div id="knob"></div></div>

<div id="thr" class="off" aria-label="Acelerador"><div id="thrFill"></div></div>

<button id="mapbtn" class="off" aria-label="Mapa" title="Mapa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2zM9 4v14M15 6v14"/></svg></button>
<div id="mhud" class="off"></div>
<div id="hstats" class="off"></div>
<button id="backbtn" class="off" aria-label="Voltar ao hangar" title="Voltar ao hangar"><svg viewBox="0 0 24 24"><path d="M10 6l-6 6 6 6M4 12h16"/></svg></button>
<button id="gbtn" class="off" aria-label="Gráficos" title="Gráficos"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.6 7.6 0 000-2l2.1-1.6-2-3.5-2.5 1a7.500 7.500 0 00-1.700-1L15 3.200h-4l-.4 2.700a7.500 7.500 0 00-1.700 1l-2.500-1-2 3.500L6.600 11a7.600 7.600 0 000 2l-2.100 1.600 2 3.500 2.500-1a7.500 7.500 0 001.700 1l.4 2.700h4l.4-2.700a7.500 7.500 0 001.700-1l2.500 1 2-3.500zM13 15.500a3.500 3.500 0 110-7 3.500 3.500 0 010 7z" transform="translate(-1 0)"/></svg></button>
<button id="backbtn" class="off" aria-label="Voltar ao hangar" title="Voltar ao hangar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6l-6 6 6 6M4 12h16"/></svg></button>
<div id="gs" class="off" role="dialog" aria-label="Gráficos"><div class="card"><span class="lbl" data-i18n="gfx">Gráficos</span><div class="opts" id="gsOpts"><button data-g="baixo" data-i18n="low">Baixo</button><button data-g="medio" data-i18n="mid">Médio</button><button data-g="alto" data-i18n="high">Alto</button></div></div></div>
<button id="sepbtn" class="off" aria-label="Separar estágio" title="Separar estágio"><svg viewBox="0 0 24 24"><path d="M5 2h14v7H5zM5 15h14v7H5zM11 10h2v4h-2z"/></svg></button>
<button id="twbtn" class="off" aria-label="Time warp" title="Time warp"><svg viewBox="0 0 24 24"><path d="M3 5l8 7-8 7zM12 5l8 7-8 7z"/></svg></button>
<div id="twsel" class="off"><button id="twless" aria-label="Diminuir">&lt;</button><span id="twl">1×</span><button id="twmore" aria-label="Aumentar">&gt;</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var PR=12300,G0=9.8;
function setDifficulty(d){PR=d==='dificil'?15580:12300;G0=d==='dificil'?14.7:9.8;MU=G0*PR*PR;CEN.set(0,-(PR+.4),0);}
const cv=document.getElementById('c');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new THREE.Scene();S.background=new THREE.Color(0x060912);
const cam=new THREE.PerspectiveCamera(50,1,.1,200);cam.position.set(0,0,9);

// fundo estrelado: duas camadas, cores levemente variadas
function camada(n,size,rmin){
  const g=new THREE.BufferGeometry(),p=[],c=[],cols=[0xffffff,0xcfdcff,0xaac4ff,0xffe6c2].map(h=>new THREE.Color(h));
  for(let i=0;i<n;i++){const r=rmin+Math.random()*80,a=Math.random()*6.283,b=Math.acos(2*Math.random()-1);
    p.push(r*Math.sin(b)*Math.cos(a),r*Math.sin(b)*Math.sin(a),r*Math.cos(b));
    const k=cols[Math.floor(Math.random()*4)],m=.5+Math.random()*.5;c.push(k.r*m,k.g*m,k.b*m);}
  g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(c,3));
  const pts=new THREE.Points(g,new THREE.PointsMaterial({size,vertexColors:true,sizeAttenuation:false,transparent:true}));
  S.add(pts);return pts;
}
const fine=camada(2500,1.6,30),bright=camada(250,3.2,30);

// hangar: chão pequeno, limbo cinza
const hangar=new THREE.Group();hangar.visible=false;S.add(hangar);
const chao=new THREE.Mesh(new THREE.BoxGeometry(10,.3,10),new THREE.MeshStandardMaterial({color:0x5d6068,roughness:.9}));
chao.position.y=-.15;hangar.add(chao);
hangar.add(new THREE.HemisphereLight(0xffffff,0x6d7077,1.1));
const sol=new THREE.DirectionalLight(0xffffff,.7);sol.position.set(3,8,4);hangar.add(sol);
// peças
const menu=document.getElementById('menu');
const M={cap:new THREE.MeshStandardMaterial({color:0x2f7bff,metalness:.25,roughness:.4}),
tank:new THREE.MeshStandardMaterial({color:0xe6ebf5,metalness:.35,roughness:.4}),
tankd:new THREE.MeshStandardMaterial({color:0x8f9bb3,metalness:.5,roughness:.4}),
eng:new THREE.MeshStandardMaterial({color:0x4a4e58,metalness:.7,roughness:.35}),
engd:new THREE.MeshStandardMaterial({color:0x4a4e58,metalness:.7,roughness:.35,side:THREE.DoubleSide}),
black:new THREE.MeshStandardMaterial({color:0x0c0d10,metalness:.3,roughness:.7}),
glass:new THREE.MeshStandardMaterial({color:0x14304f,metalness:.7,roughness:.15}),
sep:new THREE.MeshStandardMaterial({color:0xd9a21b,metalness:.4,roughness:.5,side:THREE.DoubleSide}),
sepd:new THREE.MeshStandardMaterial({color:0x22252b,metalness:.5,roughness:.5}),
nose:new THREE.MeshStandardMaterial({color:0xd64545,metalness:.3,roughness:.4,side:THREE.DoubleSide}),
prop:new THREE.MeshStandardMaterial({color:0xb8bcc6,metalness:.7,roughness:.3}),
wing:new THREE.MeshStandardMaterial({color:0x2f7bff,metalness:.4,roughness:.45,side:THREE.DoubleSide})};
const cyl=(a,b,h,m,y=0)=>{const o=new THREE.Mesh(new THREE.CylinderGeometry(a,b,h,48),m);o.position.y=y;return o;};
const ring=(r,h,y,m)=>cyl(r+.012,r+.012,h,m,y);
const tk=(g,h)=>{g.add(cyl(.55,.55,h,M.tank),ring(.55,.05,-h/2+.03,M.tankd),ring(.55,.05,h/2-.03,M.tankd));if(h>2)g.add(ring(.55,.06,0,M.cap));};
const K=.7;
const mk=(h,r,fn)=>({h:h*K,r:r*K,build:()=>{const g=new THREE.Group();fn(g);g.scale.setScalar(K);return g;}});
const defs={
 capsula:mk(.9,.55,g=>{g.add(cyl(.15,.55,.9,M.cap),cyl(.17,.17,.05,M.sepd,.45),ring(.55,.06,-.42,M.sepd));

 cone:Object.assign(mk(1.6,.55,g=>{const pts=[];for(let i=0;i<=32;i++){const t=i/32;pts.push(new THREE.Vector2(.55*Math.sqrt(Math.max(0,1-Math.pow(t,1.7))),-.8+1.6*t));}

addEventListener('keydown',e=>{if(e.key==='Escape'){modal.classList.add('off');fl.classList.add('off');wl.classList.add('off');}});
const s3=document.getElementById('s3');
document.getElementById('ok').onclick=()=>{
  const w={id:Date.now(),nome:nome.value.trim(),dif:document.querySelector('#dif [aria-pressed=true]').dataset.v,pieces:[],t:Date.now()};
  worlds.unshift(w);persistWorlds();
  modal.classList.add('off');enterWorld(w);
};
document.querySelectorAll('#dif button').forEach(b=>b.onclick=()=>{
document.querySelectorAll('#dif button').forEach(x=>x.setAttribute('aria-pressed',x===b));});
